<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❄️ 冰棒工坊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }

  body {
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
  }

  /* ===== 頂部導航列 ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background: rgba(15, 32, 39, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid #4dd0e1;
    box-shadow: 0 4px 20px rgba(77, 208, 225, 0.3);
  }

  .logo {
    font-size: 28px;
    font-weight: bold;
    background: linear-gradient(90deg, #4dd0e1, #b3e5fc);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: logoGlow 2s ease-in-out infinite alternate;
  }

  @keyframes logoGlow {
    from { filter: drop-shadow(0 0 5px rgba(77,208,225,0.5)); }
    to   { filter: drop-shadow(0 0 15px rgba(77,208,225,0.9)); }
  }

  /* ===== 購物車圖示 ===== */
  .cart-icon {
    position: relative;
    font-size: 32px;
    cursor: pointer;
    padding: 8px 14px;
    border-radius: 12px;
    background: rgba(77, 208, 225, 0.15);
    border: 2px solid #4dd0e1;
    transition: transform 0.2s;
    user-select: none;
  }
  .cart-icon:hover { transform: scale(1.1); }

  .cart-icon.bounce { animation: cartBounce 0.5s ease; }
  @keyframes cartBounce {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.4) rotate(-10deg); }
    60%  { transform: scale(0.9) rotate(5deg); }
    100% { transform: scale(1); }
  }

  .cart-count {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #4dd0e1;
    color: #0f2027;
    font-size: 14px;
    font-weight: bold;
    min-width: 24px;
    height: 24px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
    box-shadow: 0 0 10px rgba(77,208,225,0.8);
  }

  .cart-count.pop { animation: countPop 0.4s ease; }
  @keyframes countPop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.8); background: #b3e5fc; }
    100% { transform: scale(1); }
  }

  /* ===== 標題區 ===== */
  .hero {
    text-align: center;
    padding: 50px 20px 30px;
  }
  .hero h1 {
    font-size: 42px;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(77,208,225,0.5);
  }
  .hero p { color: #a8d8e0; font-size: 18px; }

  /* ===== 商品網格 ===== */
  .products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr
