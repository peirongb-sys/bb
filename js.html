<HTML>
<HEAD>
<title>今天練習的Java Script</title>
<style>
    /* 讓原本的按鈕變得超炫砲 */
    button {
        position: relative;
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        color: #fff;
        background: linear-gradient(45deg, #ff007f, #7928ca, #4338ca, #0070f3);
        background-size: 300% 300%;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
        animation: gradient-shift 3s ease infinite;
        transition: transform 0.1s, box-shadow 0.2s;
        outline: none;
    }

    button:hover {
        transform: scale(1.1);
        box-shadow: 0 0 35px rgba(121, 40, 202, 0.9);
    }

    button:active {
        transform: scale(0.95);
    }

    @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* 點擊時的粒子爆炸動畫 */
    .particle {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: #ff007f;
        border-radius: 50%;
        pointer-events: none;
        animation: explode 0.6s ease-out forwards;
    }

    @keyframes explode {
        0% {
            transform: translate(0, 0) scale(1);
            opacity: 1;
        }
        100% {
            transform: translate(var(--tx), var(--ty)) scale(0);
            opacity: 0;
        }
    }
</style>
</HEAD>
<BODY onclick="document.body.style.background='#E8CCFF'">
<h1>今天練習的Java Script</h1>
<button onclick="sayhi(event)">加入購物車</button>

<script>
function sayhi(event) {
    // 阻止點擊按鈕時同時觸發 body 的 background 變色
    event.stopPropagation();
    
    // 彈出原本的警告視窗
    alert("你好!!");

    // 炫砲粒子爆炸特效
    const btn = event.currentTarget;
    const rect = btn.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;

    for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        // 隨機顏色與飛行方向
        const colors = ['#ff007f', '#00ffcc', '#ffff00', '#7928ca', '#ffffff'];
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        const angle = Math.random() * Math.PI * 2;
        const distance = 50 + Math.random() * 80;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        
        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);
        particle.style.left = `${btn.offsetWidth / 2}px`;
        particle.style.top = `${btn.offsetHeight / 2}px`;
        
        btn.appendChild(particle);
        setTimeout(() => particle.remove(), 600);
    }
}
</script>

</BODY>
</HTML>
